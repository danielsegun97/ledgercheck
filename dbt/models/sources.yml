version: 2
sources:
  - name: ledger
    schema: raw
    description: Atomic snapshot of validated SQLite payment history and independent control totals.
    tables:
      - name: payments
      - name: controls
models:
  - name: stg_payment_versions
    description: One accepted source version per firm and payment; amounts are integer cents.
    columns:
      - name: firm_id
        data_tests: [not_null]
      - name: payment_id
        data_tests: [not_null]
      - name: version
        data_tests: [not_null]
      - name: amount_cents
        data_tests: [not_null]
  - name: current_payments
    description: Highest source version per firm and payment, preserving history upstream.
    columns:
      - name: firm_id
        data_tests: [not_null]
      - name: payment_id
        data_tests: [not_null]
  - name: reconciliation
    description: Firm totals compared with independent controls; missing controls and missing payments are explicit exceptions.
    columns:
      - name: firm_id
        data_tests: [unique, not_null]
      - name: status
        data_tests: [not_null]
